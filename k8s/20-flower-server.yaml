# =============================================================================
# Serveur de fédération FedAvg (Module 3 — code à venir).
#   9090 : gRPC Flower (clients ml-client-usine-{1,2,3})
#   8080 : HTTP status/métriques (dashboard, Module 5)
# L'image dataspace/flower-server devient buildable dès que
# services/flower-server/main.py est livré.
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flower-server
  namespace: dataspace
  labels:
    app.kubernetes.io/name: flower-server
    app.kubernetes.io/part-of: dataspace
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flower-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flower-server
        app.kubernetes.io/part-of: dataspace
    spec:
      containers:
        - name: flower-server
          image: dataspace/flower-server:latest
          imagePullPolicy: Never
          ports:
            - name: grpc
              containerPort: 9090
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: flower-server
  namespace: dataspace
  labels:
    app.kubernetes.io/name: flower-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flower-server
  ports:
    - name: grpc
      port: 9090
      targetPort: 9090
    - name: http
      port: 8080
      targetPort: 8080
